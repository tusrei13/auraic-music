services:
  postgres:
    image: postgres:16-alpine
    container_name: auraic-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: auraic
      POSTGRES_PASSWORD: auraic_dev_secret
      POSTGRES_DB: auraic_dev
    volumes:
      - auraic_dev_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: auraic-prometheus-dev
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: auraic-grafana-dev
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  auraic_dev_pgdata:
