services:
  postgres:
    image: postgres:16-alpine
    container_name: auraic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auraic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auraic_secret}
      POSTGRES_DB: ${POSTGRES_DB:-auraic_db}
    volumes:
      - auraic_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auraic} -d ${POSTGRES_DB:-auraic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auraic-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auraic-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-auraic}:${POSTGRES_PASSWORD:-auraic_secret}@postgres:5432/${POSTGRES_DB:-auraic_db}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
    ports:
      - "5000:5000"
    networks:
      - auraic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auraic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://backend:5000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3001:3001"
    networks:
      - auraic-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: auraic-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - auraic_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - auraic-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: auraic-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-auraic_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - auraic_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - auraic-network

networks:
  auraic-network:
    driver: bridge

volumes:
  auraic_postgres_data:
  auraic_prometheus_data:
  auraic_grafana_data:
